name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Match tag with package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.ts

  checks:
    name: Release checks
    needs: version
    uses: ./.github/workflows/ci.yml
