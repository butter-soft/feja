name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Match tag with package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.ts

  checks:
    name: Release checks
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: pnpm/action-setup@v6

      - name: Install dependencies and build package
        run: pnpm install --frozen-lockfile

      - name: Publish
        run: npm publish --access public
