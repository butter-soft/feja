plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.buttersoft.feja'
version = '0.0.0'

android {
  namespace "io.buttersoft.feja"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'io.arrow-kt:arrow-core:2.3.0.1'
  implementation 'org.altbeacon:android-beacon-library:2.21.2'
  implementation project(':feja-domain')
}
